[project]
name = "callfw"
version = "0.1.0"
description = "Call firewall + AI assistant: triage server"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "anthropic>=1.0",
  "twilio>=9.0",
  "phonenumbers>=8.13",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "google-auth-oauthlib>=1.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["callfw"]
